<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CAPTA Energy Monitor</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CAPTA</p>
        <h1>Energy monitor</h1>
        <label>
          API token
          <input id="token" type="password" autocomplete="current-password" required>
        </label>
      </header>

      <section>
        <h2>Instantaneous power</h2>
        <form id="power-form">
          <label>Date <input id="power-date" type="date" required></label>
          <label>Start hour <input id="start-hour" type="number" min="0" max="23" value="0" required></label>
          <label>End hour <input id="end-hour" type="number" min="1" max="24" value="24" required></label>
          <label>Voltage <input id="power-voltage" type="number" min="1" value="220" required></label>
          <button type="submit">Load power</button>
        </form>
        <p id="power-summary" class="summary"></p>
        <canvas id="power-chart" height="280"></canvas>
      </section>

      <section>
        <h2>Daily consumption</h2>
        <form id="consumption-form">
          <label>Start date <input id="consumption-date" type="date" required></label>
          <label>Voltage <input id="consumption-voltage" type="number" min="1" value="220" required></label>
          <label>Days <input id="days" type="number" min="1" max="90" value="30" required></label>
          <button type="submit">Load consumption</button>
        </form>
        <p id="consumption-summary" class="summary"></p>
        <canvas id="consumption-chart" height="280"></canvas>
      </section>

      <section>
        <h2>Daily CSV export</h2>
        <form id="export-form">
          <label>Date <input id="export-date" type="date" required></label>
          <button type="submit">Download CSV</button>
        </form>
      </section>

      <p id="error" role="alert"></p>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
